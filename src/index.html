<title>Ламинат · лаборатория прочности</title>
<meta name="description" content="Критерии прочности слоя и прогрессивное разрушение слоистого композита: интерактивные поверхности прочности и виртуальные испытания пакета. Failure criteria and progressive failure of composite laminates: interactive failure surfaces and virtual tests.">
<script>
  // Тема и масштаб применяются до отрисовки, чтобы страница не мигала.
  try {
    var saved = JSON.parse(localStorage.getItem('laminate.ui') || '{}');
    if (saved.theme === 'dark') document.documentElement.dataset.theme = 'dark';
    if (saved.scale) document.documentElement.style.setProperty('--scale', saved.scale);
  } catch (e) {}
</script>
